[package]
name = "betterstack-status-bot"
version = "1.0.0"
edition = "2024"
rust-version = "1.95"
description = "A Discord bot that posts Better Stack status page incidents and reports live service uptime"
repository = "https://github.com/Aster-Privacy/betterstack-status-bot"
license = "Unlicense"
readme = "README.md"
keywords = ["discord", "betterstack", "status", "uptime", "bot"]
categories = ["command-line-utilities"]

[dependencies]
chrono = { version = "0.4.43", features = ["serde"] }
dotenv = "0.15.0"
poise = { git = "https://github.com/serenity-rs/poise", branch = "serenity-next" }
reqwest = { version = "0.13", features = ["json"] }
rss = "2.0.12"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "sqlite", "macros"] }
tokio = { version = "1.49.0", features = ["rt-multi-thread"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.22"

[profile.release]
strip = true
lto = true
codegen-units = 1
